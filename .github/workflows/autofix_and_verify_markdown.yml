name: Auto-fix and Lint Markdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  autofix-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Prettier on markdown
        run: prettier --write "**/*.md" --print-width 80 --prose-wrap always

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint auto-fix
        run: markdownlint-cli2 --fix "**/*.md" || true

      - name: Commit and push changes (only on push events)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Ensure local main matches origin/main to avoid accidental history divergence
          git fetch origin main
          git checkout -B main origin/main

          # Stage markdown files (enable globstar for **)
          bash -lc 'shopt -s globstar || true; git add -- *.md **/*.md || true'

          # If there are staged changes, commit and push
          if git diff --cached --quiet; then
            echo "No markdown fixes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-fix markdown formatting"
            echo "Attempting to push autofix commit to origin/main..."
            if ! git push origin HEAD:main; then
              echo "::warning::Push failed. The GITHUB_TOKEN may not have write permission or branch protections may block pushes."
              echo "If you want automatic pushes, enable 'Workflow permissions: Read and write' or provide a PAT via a secret."
            else
              echo "Autofix commit pushed."
            fi
          fi

      - name: Run markdownlint (validation)
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
